<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Headset">
  <!-- The tab icon: a headset, which is what the app is about — something
       listened to, and something said into. It is drawn rather than exported
       so it stays sharp at every size. It is black, and turns white where the
       browser draws its chrome dark — a black glyph on a dark tab bar is a
       glyph nobody can find. -->
  <style>
    :root { color: #000000; }

    @media (prefers-color-scheme: dark) {
      :root { color: #ffffff; }
    }
  </style>

  <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M6 18v-3a10 10 0 0 1 20 0v3" />
    <path d="M26 25.5v1a2.5 2.5 0 0 1-2.5 2.5H21" />
  </g>

  <!-- The cups and the microphone are solid: at sixteen pixels an outline of
       them is a smudge, and a filled shape still reads as one. -->
  <rect x="3" y="16" width="6" height="10" rx="3" fill="currentColor" />
  <rect x="23" y="16" width="6" height="10" rx="3" fill="currentColor" />
  <circle cx="19" cy="29" r="1.8" fill="currentColor" />
</svg>
